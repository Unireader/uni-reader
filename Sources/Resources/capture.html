        <!DOCTYPE html>
        <html lang="zh-Hans">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <title>UniReader 采集端</title>
        <style>
          * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
          html,body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#0d1117; color:#e6edf3;
            font-family:-apple-system,"PingFang SC",system-ui,sans-serif; }
          canvas { position:fixed; inset:0; }
          #bg { z-index:1; }
          #ink { z-index:2; touch-action:none; }
          #live { z-index:3; pointer-events:none; }   /* 正在写的这一笔（对应 Mac 的 InkLiveLayer） */
          #hover { z-index:4; pointer-events:none; }
          /* 选笔盘底：真毛玻璃只能由 DOM 元素做（canvas 画不了 backdrop-filter），
             故盘底是这个圆形 div，扇区/图标/hub 由上面的 #radial canvas 叠着画。 */
          #radialGlass { position:fixed; z-index:5; pointer-events:none; display:none;
            border-radius:50%; background:rgba(20,23,28,.62);
            border:1px solid rgba(255,255,255,.22); box-shadow:0 4px 20px rgba(0,0,0,.30); }
          @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
            /* 支持毛玻璃时底色调得很淡，让页面内容透上来（对比度靠图标自带色片，不靠盘底堆）；
               不支持则维持上面的高不透明度深色兜底 */
            #radialGlass { background:rgba(20,23,28,.16);
              -webkit-backdrop-filter:blur(16px) saturate(140%); backdrop-filter:blur(16px) saturate(140%); }
          }
          #radial { z-index:6; pointer-events:none; }
          #topbar { position:fixed; left:0; right:0; top:0; height:46px; z-index:10;
            display:flex; align-items:center; gap:10px; padding:0 10px;
            background:rgba(22,27,34,.9); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
            border-bottom:1px solid #30363d; }
          #dot { width:10px; height:10px; border-radius:50%; background:#f85149; flex:none; }
          #dot.on { background:#3fb950; }
          #lat { color:#8b949e; font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap; }
          #docs { max-width:24vw; padding:6px 8px; border:1px solid #30363d; border-radius:8px;
            background:#21262d; color:#e6edf3; font-size:14px; }
          #zoomLabel { color:#8b949e; font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap; }
          #pageLabel { margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; }
          #topbar button { padding:8px 14px; font-size:16px; border:1px solid #30363d; border-radius:8px;
            background:#21262d; color:#e6edf3; }
          #topbar button:active { background:#30363d; }
          #lat { cursor:pointer; }
          #stats { position:fixed; right:8px; top:52px; z-index:11; display:none;
            background:rgba(22,27,34,.94); border:1px solid #30363d; border-radius:8px; padding:10px 12px;
            font:12px/1.55 ui-monospace,Menlo,monospace; color:#e6edf3; white-space:pre; min-width:180px; }
          #stats.on { display:block; }
          #penStat { position:fixed; left:10px; bottom:10px; z-index:10; pointer-events:none;
            display:flex; align-items:center; gap:7px; padding:6px 12px;
            background:rgba(22,27,34,.85); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
            border:1px solid #30363d; border-radius:999px; font-size:13px; color:#e6edf3; }
          #penStat .sw { width:12px; height:12px; border-radius:50%; flex:none;
            border:1px solid rgba(255,255,255,.45); }
        </style>
        </head>
        <body>
        <canvas id="bg"></canvas>
        <canvas id="ink"></canvas>
        <canvas id="live"></canvas>
        <canvas id="hover"></canvas>
        <div id="radialGlass"></div>
        <canvas id="radial"></canvas>
        <div id="topbar">
          <span id="dot"></span>
          <span id="lat">— ms</span>
          <select id="docs"></select>
          <span id="zoomLabel">100%</span>
          <span id="pageLabel">— / —</span>
          <button id="prev">‹</button>
          <button id="next">›</button>
          <button id="night" title="夜间模式">🌙</button>
          <button id="eye" title="显示/隐藏页面">👁</button>
          <button id="lock" title="锁定缩放">🔓</button>
          <button id="full">⛶</button>
        </div>
        <div id="stats"></div>
        <div id="penStat"></div>
        <script>__WIRE_JS__</script>
        <script>
        (function () {
          var PORT = __WS_PORT__, TOKEN = "__TOKEN__";
          var BAR = 46, GAP = 8, MINZ = 0.5, MAXZ = 5;
          var PENS = __PENS__;   // 由 Mac 端按设置注入（名字/颜色/粗细可配置）
          var MODES = [{ key: "note", label: "笔记" }, { key: "erase", label: "擦除" }, { key: "page", label: "翻页" }];
          var modeIdx = 0, penIdx = 0;

          var el = function (id) { return document.getElementById(id); };
          var bg = el("bg"), ink = el("ink"), live = el("live"), hover = el("hover"), radialCv = el("radial");
          var radialGlass = el("radialGlass");   // 选笔盘的毛玻璃底盘（DOM，非 canvas）
          var bctx = bg.getContext("2d"), ictx = ink.getContext("2d"), hctx = hover.getContext("2d");
          var lctx = live.getContext("2d"), rctx = radialCv.getContext("2d");
          var DPR = 1;
          function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

          // ---- 文档布局（连续页面列 + 缩放）----
          var docV = "", pageCount = 0, pagesWH = [];   // pagesWH: [[w,h],...] 原始点尺寸
          var vw = 1, availH = 1, dispH = [], offY = [], totalH = 0;
          var zoom = 1, scrollX = 0, scrollY = 0, maxScrollX = 0, maxScrollY = 0;
          var imgs = {};        // i -> Image（按需加载 + 缓存）
          var vpSeq = 0;        // 已应用的 Mac viewport 序号

          function pw() { return vw * zoom; }                                   // 页(内容)宽
          function contentLeft() { var p = pw(); return p <= vw ? (vw - p) / 2 : -scrollX; }  // 内容左缘视口 x

          function curMode() { return MODES[modeIdx].key; }
          function curPen() { return PENS[penIdx]; }

          // ---- 笔触类型：跟 Mac 端 PenBrushType.strokeWidth/opacityMultiplier 同一套公式 ----
          function strokeWidthFor(t, p, w) {
            if (t === "fountain") return 0.3 + Math.pow(p, 1.6) * w * 1.15;
            if (t === "marker") return w;
            if (t === "pencil") return 0.5 + p * w * 0.85;
            return 0.6 + p * w;   // ballpoint / 未知类型兜底
          }
          function opacityMultFor(t) { return t === "pencil" ? 0.85 : 1; }
          function scaledColor(css, mult) {
            if (mult === 1) return css;
            var m = /rgba?\(([^)]+)\)/.exec(css);
            if (!m) return css;
            var parts = m[1].split(",").map(function (s) { return parseFloat(s); });
            var a = parts.length > 3 ? parts[3] : 1;
            return "rgba(" + parts[0] + "," + parts[1] + "," + parts[2] + "," + (a * mult) + ")";
          }

          function sizeCanvas(c, cx) {
            c.width = Math.round(window.innerWidth * DPR);
            c.height = Math.round(window.innerHeight * DPR);
            c.style.width = window.innerWidth + "px";
            c.style.height = window.innerHeight + "px";
            cx.setTransform(DPR, 0, 0, DPR, 0, 0);
            cx.lineCap = "round"; cx.lineJoin = "round";
          }

          // 只重算几何（不动 canvas 尺寸），供缩放时保持锚点用。
          function recompute() {
            vw = window.innerWidth;
            availH = window.innerHeight - BAR;
            var p = pw(), y = 0; dispH = []; offY = [];
            for (var i = 0; i < pageCount; i++) {
              var w = (pagesWH[i] && pagesWH[i][0]) || 1, h = (pagesWH[i] && pagesWH[i][1]) || 1.4142;
              var dh = w > 0 ? p * h / w : p;
              offY[i] = y; dispH[i] = dh; y += dh + GAP;
            }
            totalH = Math.max(0, y - GAP);
            maxScrollY = Math.max(0, totalH - availH);
            maxScrollX = Math.max(0, p - vw);
          }
          function relayout() {
            DPR = Math.max(1, window.devicePixelRatio || 1);
            sizeCanvas(bg, bctx); sizeCanvas(ink, ictx); sizeCanvas(live, lctx);
            sizeCanvas(hover, hctx); sizeCanvas(radialCv, rctx);
            recompute();
            scrollX = clamp(scrollX, 0, maxScrollX); scrollY = clamp(scrollY, 0, maxScrollY);
            ensureImages(); drawAll(); drawRadial(); updateHud(); emitGeom();
          }
          window.addEventListener("resize", relayout);

          // ---- 按需取图（可见 + 上下各一屏预取）----
          function ensureImages() {
            if (!pageCount || !showPage) return;
            var top = scrollY - availH, bot = scrollY + availH * 2;
            for (var i = 0; i < pageCount; i++) {
              if (offY[i] + dispH[i] >= top && offY[i] <= bot) loadImg(i);
            }
          }
          function loadImg(i) {
            if (imgs[i]) return;
            var im = new Image();
            im.onload = function () { drawBg(); };
            im.src = "/page.png?i=" + i + "&v=" + encodeURIComponent(docV);
            imgs[i] = im;
          }

          // ---- 坐标映射（跨页 + 缩放）----
          function locate(x, vy) {
            var cl = contentLeft(), p = pw();
            var docY = vy - BAR + scrollY;
            for (var i = 0; i < pageCount; i++) {
              if (docY >= offY[i] && docY <= offY[i] + dispH[i]) {
                return { page: i, nx: clamp((x - cl) / p, 0, 1), ny: clamp((docY - offY[i]) / dispH[i], 0, 1) };
              }
            }
            return null;
          }
          function pageToView(page, nx, ny) {
            if (page < 0 || page >= pageCount) return { x: 0, y: -1e6 };
            var docY = offY[page] + ny * dispH[page];
            return { x: contentLeft() + nx * pw(), y: BAR + docY - scrollY };
          }
          function inContent(x, y) { return y >= BAR && locate(x, y) !== null; }

          // ---- 绘制 ----
          function drawAll() { drawBg(); drawInk(); drawLive(); }
          function drawBg() {
            bctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            var cl = contentLeft(), p = pw();
            for (var i = 0; i < pageCount; i++) {
              var vy = BAR + offY[i] - scrollY;
              if (vy + dispH[i] < BAR || vy > window.innerHeight) continue;
              bctx.fillStyle = "#fff"; bctx.fillRect(cl, vy, p, dispH[i]);
              if (!showPage) continue;   // 手写板模式：仅白底，不取图
              var im = imgs[i];
              if (im && im.complete && im.naturalWidth) bctx.drawImage(im, cl, vy, p, dispH[i]);
              else { bctx.fillStyle = "#e9edf2"; bctx.fillRect(cl, vy, p, dispH[i]); loadImg(i); }
            }
          }
          /// 画一整条笔画到指定 context（静态层与活体层共用，保证两者观感一致）。
          /// **marker 必须整条一次成 path**（平头 + multiply），与 Mac 端 `inkDrawStroke` 的 marker 分支同理：
          /// 逐段 stroke 会让相邻段的线帽互相重叠，不透明笔看不出来，半透明笔（荧光笔）就叠成一串圆斑。
          function drawStroke(cx, s) {
            var pts = s.pts; if (!pts.length) return;
            var t = s.pen.t || "ballpoint", color = scaledColor(s.pen.color, opacityMultFor(t));
            var p0 = pageToView(s.page, pts[0][0], pts[0][1]);
            if (pts.length === 1) {   // 单点 = 一个圆点（同 Mac 端单点分支）
              cx.fillStyle = color;
              cx.beginPath(); cx.arc(p0.x, p0.y, strokeWidthFor(t, pts[0][2], s.pen.w) / 2, 0, Math.PI * 2); cx.fill();
              return;
            }
            var lp = p0, i;
            if (t === "marker") {
              cx.save();
              cx.globalCompositeOperation = "multiply";
              cx.lineCap = "square"; cx.lineJoin = "round";   // 平头：圆头会在起收笔处鼓出来
              cx.strokeStyle = color; cx.lineWidth = s.pen.w;
              cx.beginPath(); cx.moveTo(p0.x, p0.y);
              for (i = 1; i < pts.length; i++) {
                var q = pageToView(s.page, pts[i][0], pts[i][1]);
                cx.quadraticCurveTo(lp.x, lp.y, (lp.x + q.x) / 2, (lp.y + q.y) / 2);
                lp = q;
              }
              cx.stroke();
              cx.restore();
              return;
            }
            // ballpoint / fountain / pencil：线宽随压感变，只能逐段画（与 Mac 端 default 分支同款）
            cx.fillStyle = color;
            cx.beginPath(); cx.arc(p0.x, p0.y, strokeWidthFor(t, pts[0][2], s.pen.w) / 2, 0, Math.PI * 2); cx.fill();
            var lastMid = p0;
            for (i = 1; i < pts.length; i++) {
              var pv = pageToView(s.page, pts[i][0], pts[i][1]), pr = pts[i][2];
              var mx = (lp.x + pv.x) / 2, my = (lp.y + pv.y) / 2;
              cx.strokeStyle = color; cx.lineWidth = strokeWidthFor(t, pr, s.pen.w);
              cx.beginPath(); cx.moveTo(lastMid.x, lastMid.y); cx.quadraticCurveTo(lp.x, lp.y, mx, my); cx.stroke();
              lastMid = { x: mx, y: my }; lp = pv;
            }
          }
          /// 静态层：已成形的笔迹（Mac 回传的唯一真源）。
          function drawInk() {
            ictx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            for (var i = 0; i < strokes.length; i++) drawStroke(ictx, strokes[i]);
          }
          /// 活体层：正在写的这一笔，**每次落点整条重画**（不往已有像素上增量叠加，否则半透明笔会累积出圆斑）。
          /// 与 Mac 端 `InkLiveLayer` 同构；单独一层，故重画一笔不牵动整页笔迹。
          function drawLive() {
            lctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            if (cur) drawStroke(lctx, cur);
          }

          // 笔迹状态：`strokes` = Mac 回传的已成形笔迹（静态层），`cur` = 正在写的这一笔（活体层）。
          // 铅笔的抖动纹理这边没做（跟 Mac 端的已知简化一致），其余笔型两端同算法同参数。
          var strokes = [], cur = null, radialActive = false;   // radialActive：Mac 已把这半笔转成环形选笔盘

          function eraseHit(x, y) {
            var r = 18, changed = false;
            for (var i = strokes.length - 1; i >= 0; i--) {
              var pts = strokes[i].pts;
              for (var j = 0; j < pts.length; j++) {
                var pv = pageToView(strokes[i].page, pts[j][0], pts[j][1]);
                if ((pv.x - x) * (pv.x - x) + (pv.y - y) * (pv.y - y) <= r * r) { strokes.splice(i, 1); changed = true; break; }
              }
            }
            if (changed) drawInk();
          }

          // ---- 平移 / 缩放 / 纵向锚点 ----
          function panBy(dx, dy) {
            scrollX = clamp(scrollX + dx, 0, maxScrollX);
            scrollY = clamp(scrollY + dy, 0, maxScrollY);
            ensureImages(); drawAll(); updatePageLabel(); emitScroll();
          }
          function cancelMomentum() { if (momentumRAF) { cancelAnimationFrame(momentumRAF); momentumRAF = null; } }
          // 松手惯性：按松手速度继续滚，指数衰减；碰边界该轴停；期间持续上报让 Mac 平滑跟随。
          function startMomentum() {
            cancelMomentum();
            if (Math.hypot(vx, vy) < 0.05) return;   // 太慢不惯性
            var last = performance.now();
            function step() {
              var now = performance.now(), dt = Math.min(50, now - last); last = now;
              scrollX = clamp(scrollX + vx * dt, 0, maxScrollX);
              scrollY = clamp(scrollY + vy * dt, 0, maxScrollY);
              var decay = Math.pow(0.94, dt / 16);
              vx *= decay; vy *= decay;
              if (scrollX <= 0 || scrollX >= maxScrollX) vx = 0;
              if (scrollY <= 0 || scrollY >= maxScrollY) vy = 0;
              ensureImages(); drawAll(); updatePageLabel(); emitScroll();
              momentumRAF = Math.hypot(vx, vy) > 0.02 ? requestAnimationFrame(step) : null;
            }
            momentumRAF = requestAnimationFrame(step);
          }
          var reportPending = false;
          function emitScroll() {
            if (reportPending) return; reportPending = true;
            requestAnimationFrame(function () {
              reportPending = false;
              var docY = scrollY;
              for (var i = 0; i < pageCount; i++) {
                if (docY < offY[i] + dispH[i] + GAP) {   // 严格 <，与 topVisiblePage 同一边界
                  send({ type: "scroll", page: i, frac: clamp((docY - offY[i]) / Math.max(1, dispH[i]), 0, 1), t: performance.now() });
                  return;
                }
              }
            });
          }
          function topVisiblePage() {
            // 严格 <：翻到某页正顶部时（offY[i] == 上页底+GAP）必须算本页，
            // 否则「下一页」按了原地不动、「上一页」连跳两页。
            for (var i = 0; i < pageCount; i++) if (scrollY < offY[i] + dispH[i] + GAP) return i;
            return Math.max(0, pageCount - 1);
          }
          function updatePageLabel() {
            el("pageLabel").textContent = pageCount ? (topVisiblePage() + 1) + " / " + pageCount : "— / —";
          }
          // 笔的用途状态胶囊：笔记模式显示当前笔（色块/类型/粗细），其余模式显示模式名。
          // 状态可来自本地侧键、Mac 悬浮工具条或环形选笔盘下发，统一在这里回显。
          var BRUSH_LABELS = { ballpoint: "圆珠笔", fountain: "钢笔", marker: "马克笔", pencil: "铅笔" };
          function updatePenStat() {
            var m = curMode(), html;
            if (m === "note") {
              var p = curPen();
              html = p ? '<span class="sw" style="background:' + p.color + '"></span>'
                         + (BRUSH_LABELS[p.t] || "圆珠笔") + " · " + (Math.round(p.w * 100) / 100) + "pt"
                       : "笔记";
            } else if (m === "erase") { html = "橡皮擦"; }
            else { html = "翻页 · 拖动平移"; }
            el("penStat").innerHTML = html;
          }
          function updateHud() {
            el("zoomLabel").textContent = Math.round(zoom * 100) + "%";
            updatePageLabel();
            updatePenStat();
          }
          // 收到 Mac 视口 → 程序化滚到该(页,纵向比例)，不回发。
          // force=1（新连接/切文档后的初始进度同步）绕过 seq 去重——该锚点的 seq 可能早就用过。
          function applyViewport(o) {
            if (activeId !== null) return;              // 正在写，忽略
            cancelMomentum();                           // Mac 下发视口 → 停止本地惯性，避免抢位
            if (!o.force) {
              if ((o.seq || 0) <= vpSeq) return; vpSeq = o.seq || 0;
            }
            var p = o.page || 0, f = o.frac || 0;
            if (p >= pageCount) return;
            scrollY = clamp(offY[p] + f * dispH[p], 0, maxScrollY);
            ensureImages(); drawAll(); updatePageLabel();
          }

          // ---- 指针：笔=画/平移，手指=平移/双指缩放 ----
          var activeId = null, penMode = "", penX = 0, penY = 0, batch = [], drawPage = 0;
          // 探针流（擦除/翻页模式专用）：平行上报笔位置给 Mac 做长按检测/环形盘，本地动作照跑。
          var pbatch = [], probePage = 0, probing = false;
          var touches = {}, touchOrder = [], panId = null, lastPanX = 0, lastPanY = 0, pinch = null;
          var zoomLocked = false;
          var showPage = true;                                    // false = 纯手写板（不取图、只白底）
          var panDownX = 0, panDownY = 0, panStarted = false;   // 单指平移死区
          var PALM = 60, DEAD = 8;                                // 手掌接触阈值(px)、平移死区(px)
          var vx = 0, vy = 0, lastMoveT = 0, momentumRAF = null;  // 惯性滚动（速度单位: scroll px/ms）

          function beginPinch() {
            var a = touches[touchOrder[0]], b = touches[touchOrder[1]];
            var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, p = pw();
            pinch = {
              d0: Math.max(40, Math.hypot(a.x - b.x, a.y - b.y)),   // 初始间距下限，避免起手两指过近灵敏度爆炸
              z0: zoom,
              fx: p > 0 ? (mx - contentLeft()) / p : 0.5,            // 捏合中点抓住的内容比例（固定锚点）
              fy: totalH > 0 ? (my - BAR + scrollY) / totalH : 0
            };
            panId = null; panStarted = false;
          }

          ink.addEventListener("pointerdown", function (e) {
            cancelMomentum();
            if (e.pointerType === "touch") {
              if (activeId !== null) { e.preventDefault(); return; }   // 笔在写 → 忽略手掌
              if (e.width > PALM || e.height > PALM) { e.preventDefault(); return; }   // 大面积接触（手掌）忽略
              touches[e.pointerId] = { x: e.clientX, y: e.clientY };
              if (touchOrder.indexOf(e.pointerId) < 0) touchOrder.push(e.pointerId);
              if (touchOrder.length >= 2) beginPinch();
              else {
                panId = e.pointerId; lastPanX = e.clientX; lastPanY = e.clientY;
                panDownX = e.clientX; panDownY = e.clientY; panStarted = false;
                vx = 0; vy = 0; lastMoveT = performance.now();
              }
              e.preventDefault(); return;
            }
            // 笔
            var m = curMode();
            if (m === "page") {   // 翻页模式：笔拖动平移画面（同时起探针流，供 Mac 检测长按呼出选笔盘）
              activeId = e.pointerId; penMode = "page";
              try { ink.setPointerCapture(e.pointerId); } catch (x) {}

          }

          function cycleMode() { modeIdx = (modeIdx + 1) % MODES.length; activeId = null; penMode = ""; endHover(); updateHud(); send({ type: "mode", mode: curMode() }); }
          function cyclePen() {
            penIdx = (penIdx + 1) % PENS.length; modeIdx = 0; updateHud();
            send({ type: "pen", index: penIdx }); send({ type: "mode", mode: curMode() });
          }
          window.addEventListener("keydown", function (e) {
            if (e.repeat) return;
            if (e.key === "PageUp") { e.preventDefault(); cycleMode(); }
            else if (e.key === "PageDown") { e.preventDefault(); cyclePen(); }
          });

          // ---- 全屏 ----
          el("full").addEventListener("click", function () {
            if (!document.fullscreenElement) {
              var root = document.documentElement;
              var req = root.requestFullscreen || root.webkitRequestFullscreen;
              // 不锁定方向：竖屏/横屏均可，布局随 resize 自适应
              if (req) Promise.resolve(req.call(root)).catch(function () {});
            } else {
              (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            }
          });

          // ---- 延迟 stats（点击顶栏延迟数字展开）----
          var rtts = [], upCount = 0, downCount = 0, frames = 0, statsOn = false;
          setInterval(function () {
            var n = rtts.length, sum = 0, mn = 1e9, mx = 0, jit = 0;
            for (var i = 0; i < n; i++) { var r = rtts[i]; sum += r; if (r < mn) mn = r; if (r > mx) mx = r; if (i > 0) jit += Math.abs(r - rtts[i - 1]); }
            var avg = n ? sum / n : 0; jit = n > 1 ? jit / (n - 1) : 0; if (!n) { mn = 0; mx = 0; }
            el("lat").textContent = n ? (Math.round(avg) + "±" + Math.round(jit) + " ms") : "— ms";
            if (statsOn) el("stats").textContent =
              "RTT  avg " + Math.round(avg) + " ms\n" +
              "     min " + Math.round(mn) + "  max " + Math.round(mx) + "\n" +
              "     jitter " + Math.round(jit) + " ms  (n=" + n + ")\n" +
              "↑ 上行  " + upCount + " msg/s\n" +
              "↓ 下行  " + downCount + " msg/s\n" +
              "画面 fps " + frames;
            upCount = 0; downCount = 0; frames = 0;
          }, 1000);

          // ---- WebSocket ----
          var ws, pingTimer = null, lastPong = 0, retryTimer = null, retryDelay = 1500;
          function send(o) { if (ws && ws.readyState === 1) { var b = Wire.encode(o); if (b) { ws.send(b); upCount++; } } }
          function connect() {
            if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;   // 已有活连接/正在连，不重复建
            if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
            ws = new WebSocket("ws://" + location.hostname + ":" + PORT + "/");
            ws.binaryType = "arraybuffer";
            ws.onopen = function () { ws.send(Wire.encode({ type: "auth", token: TOKEN })); };
            ws.onmessage = function (e) { var o = Wire.decode(e.data); if (o) { try { onMsg(o); } catch (x) {} } };
            ws.onerror = function () { try { ws.close(); } catch (x) {} };   // 出错统一走 onclose → 重连
            ws.onclose = function () {
              if (this !== ws) return;   // 旧实例的迟到事件，别清掉新连接的状态
              el("dot").className = "";
              radialActive = false; setRadial(null); setPressRing(null);   // 断线时盘/环正开着 → 收掉（Mac 不会补发瞬态状态）
              if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
              scheduleRetry();
            };
          }
          // 自动重连：1.5s 起步、翻倍退避封顶 10s；authOK 后重置。重连后 Mac 会补发全量状态（文档/页面/笔迹）。
          function scheduleRetry() {
            if (retryTimer) return;
            retryTimer = setTimeout(function () { retryTimer = null; connect(); }, retryDelay);
            retryDelay = Math.min(retryDelay * 2, 10000);
          }
          function startPing() {
            if (pingTimer) return;
            lastPong = Date.now(); retryDelay = 1500;
            pingTimer = setInterval(function () {
              // 看门狗：半开连接（锁屏/切网/Mac 睡眠后 onclose 迟迟不触发）5s 无 pong 即杀掉重连
              if (Date.now() - lastPong > 5000) { try { ws.close(); } catch (x) {} scheduleRetry(); return; }
              send({ type: "ping", t: Date.now() });
            }, 1000);
            send({ type: "ping", t: Date.now() });
          }
          function onMsg(o) {
            downCount++;
            if (o.type === "authOK") {
              el("dot").className = "on"; startPing();
              send({ type: "mode", mode: curMode() }); send({ type: "pen", index: penIdx });   // 连接即同步当前工具状态给 Mac
              lastGeomW = -1; emitGeom();   // 重连后 Mac 那边的页宽是空的，无条件补一发
            }
            else if (o.type === "pong") { lastPong = Date.now(); var rtt = Date.now() - (o.t || 0); rtts.push(rtt); if (rtts.length > 40) rtts.shift(); send({ type: "latency", ms: rtt }); }
            else if (o.type === "layout") { setLayout(o); }
            else if (o.type === "viewport") { applyViewport(o); }
            else if (o.type === "docs") { setDocs(o); }
            // 收藏笔列表整体同步（画布悬浮工具条实时增删改后，Mac 推下来）：替换本地 PENS + 当前下标。
            else if (o.type === "pens") {
              PENS = (o.list || []).map(function (p) { return { color: p.color, w: p.w, t: p.t }; });
              if (!PENS.length) PENS = [{ color: "rgba(24,90,210,0.95)", w: 8, t: "ballpoint" }];
              penIdx = clamp(o.active || 0, 0, PENS.length - 1);
              updateHud();
            }
            else if (o.type === "pen") {
              var i = o.index || 0;
              if (i >= 0 && i < PENS.length) { penIdx = i; updateHud(); }
            }
            // Mac 侧切模式（悬浮工具条/环形盘选笔后回 note）：同步本地模式
            else if (o.type === "mode") {
              for (var mi = 0; mi < MODES.length; mi++) {
                if (MODES[mi].key === o.mode && mi !== modeIdx) { modeIdx = mi; updateHud(); break; }
              }
            }
            // Mac 检测到长按 → 把当前这半笔转成环形选笔盘：本地撤掉半笔、后续笔移不再画（只发位置驱动选笔）。
            else if (o.type === "inkCancel") { radialActive = true; cur = null; drawLive(); }
            // 环形选笔盘状态镜像（Mac 是唯一判定方）：照着画即可，open=false 收盘。
            else if (o.type === "radial") { setRadial(o); }
            // 长按进度环（盘的前置动画）：同样是 Mac 判定，on=false 撤环。
            else if (o.type === "pressRing") { setPressRing(o); }
            // Mac 回传的全部笔迹（唯一真源）：平板据此显示 + 刷新/重连/切档后恢复。正在写的这一笔(cur)不清，避免闪断。
            else if (o.type === "strokes") { strokes = o.list || []; if (activeId === null) { cur = null; drawLive(); } drawInk(); }
            // 旧 `page` 消息在方案 B 下忽略（布局改由 layout 驱动）。
          }
          function setLayout(o) {
            var v = (o.v || o.docId || "");
            var changed = v !== docV;
            docV = v; pageCount = o.count || 0; pagesWH = o.pages || [];
            if (changed) { strokes = []; cur = null; imgs = {}; scrollX = 0; scrollY = 0; zoom = 1; vpSeq = 0; }
            relayout();
          }
          function setDocs(o) {
            var sel = el("docs"); sel.innerHTML = "";
            var f = document.createElement("option"); f.value = ""; f.textContent = "⟳ 跟随 Mac"; sel.appendChild(f);
            (o.list || []).forEach(function (d) {
              var op = document.createElement("option"); op.value = d.id; op.textContent = d.title; sel.appendChild(op);
            });
            sel.value = o.following ? "" : (o.selected || "");
          }
          // 翻页按钮：滚到相邻页顶部（并上报，Mac 跟随）。
          function turn(dir) {
            if (!pageCount || !offY.length) return;   // layout 未到时按了会把 scrollY 置成 NaN，整页卡死
            var i = clamp(topVisiblePage() + (dir === "prev" ? -1 : 1), 0, Math.max(0, pageCount - 1));
            scrollY = clamp(offY[i], 0, maxScrollY);
            ensureImages(); drawAll(); updatePageLabel(); emitScroll();
          }
          el("prev").onclick = function () { turn("prev"); };
          el("next").onclick = function () { turn("next"); };
          el("lock").onclick = function () { zoomLocked = !zoomLocked; el("lock").textContent = zoomLocked ? "🔒" : "🔓"; };
          el("eye").onclick = function () { showPage = !showPage; el("eye").textContent = showPage ? "👁" : "🚫"; if (showPage) ensureImages(); drawAll(); };
          // 夜间模式：仅反转背景页图 canvas（invert 反亮度、hue-rotate 复原彩色）；墨迹/圆环不反。
          el("night").onclick = function () {
            var on = !bg.style.filter;
            bg.style.filter = on ? "invert(1) hue-rotate(180deg)" : "";
            el("night").textContent = on ? "☀️" : "🌙";
          };
          el("docs").addEventListener("change", function () { send({ type: "selectDoc", id: el("docs").value }); });
          el("lat").addEventListener("click", function () { statsOn = !statsOn; el("stats").className = statsOn ? "on" : ""; });
          window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
          // 回前台/网络恢复：立即检查连接，断了马上重连（不等退避计时器）；假活（5s 无 pong）杀掉重连。
          document.addEventListener("visibilitychange", function () {
            if (document.hidden) return;
            if (!ws || ws.readyState > 1) connect();
            else if (ws.readyState === 1 && Date.now() - lastPong > 5000) { try { ws.close(); } catch (x) {} scheduleRetry(); }
          });
          window.addEventListener("online", function () { connect(); });

          updateHud(); relayout(); connect();
        })();
        </script>
        </body>
        </html>
