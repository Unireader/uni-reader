name: UniReader
options:
  bundleIdPrefix: tech.xvanturing
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "35"
# 第三方包（SPM），目前两个：
#   - 笔记的 Markdown 引擎（TextKit 2 + AppKit；编辑器 sheet + 气泡正文只读渲染，
#     后者是「阅读区纯 SwiftUI」红线的唯一例外）。pre-1.0，**钉死版本**，升级要手动改这里再解析。
#     取两个产品：核心 `MarkdownEngine`（零外部依赖）+ `MarkdownEngineLatex`（2026-09-16 加，公式渲染；
#     传递依赖 SwiftMath，MIT，版本由引擎的 `from: 1.7.0` 解析、钉在 Package.resolved，带 ~7MB 数学字体资源）。
#     代码高亮那个产品（带 HighlighterSwift）仍没取，用到再加。
#   - Sparkle 2 自动更新框架（2026-09-18 加，参考同作者 Perch 项目的集成）。装好后：
#       - `Sources/App/UpdaterService.swift` 用 `SPUStandardUpdaterController` 驱动整条更新流程
#         （拉 appcast、EdDSA 校验、下载、out-of-process 安装、重启），用 Sparkle 自带的标准 UI，
#         不像 Perch 那样做 gentle-reminder 自定义 delegate（UniReader 是常规窗口 App 不是菜单栏 App）。
#       - `scripts/release.sh` 用 SPM artifact 里的 `sign_update` 给每个 release 的 zip 签 EdDSA，
#         把 `<item>` 插进仓库根目录的 `appcast.xml`。
#       - UniReader **不在 sandbox**，所以不需要 Installer XPC service 或额外 entitlements。
packages:
  MarkdownEngine:
    url: https://github.com/nodes-app/swift-markdown-engine
    # 2026-09-21 从 0.9.0 升到 0.13.0：0.9.0 每敲一个字都按整篇算账（17K 字的笔记 56ms/字、
    # 52K 字 159ms/字，一帧才 16.7ms），0.13.0 把增量做对了——恒定 9~11ms/字，不再随全文长度涨。
    # 量法见 `spike/markdown-relayout-cost.swift`。升级只动版本号，App 代码一行没改。
    exactVersion: 0.13.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.9.1"
  # Agent 面板的 ACP 客户端（ACP-AGENT-PLAN.md）。自家 fork：去掉了上游的 reference submodule，
  # 有问题直接改 fork 再打 v0.1.0-unireader.N 新 tag。
  ACP:
    url: https://github.com/Unireader/swift-acp
    exactVersion: 0.1.0-unireader.1
targets:
  UniReader:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: MarkdownEngine
        product: MarkdownEngine
      - package: MarkdownEngine
        product: MarkdownEngineLatex
      - package: Sparkle
        product: Sparkle
      - package: ACP
        product: ACP
      - package: ACP
        product: ACPModel
    settings:
      base:
        PRODUCT_NAME: UniReader
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.UniReader
        GENERATE_INFOPLIST_FILE: YES
        # 部分 Info.plist（UTI/文档类型声明——.unrd 工作区包），GENERATE_INFOPLIST_FILE 会与其余 key 合并。
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: UniReader
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "UniReader 通过局域网接收平板的手写笔画与翻页操作。"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        # 固定签名身份 = zqsd 团队（含 Developer ID，后续公证直接复用）。
        # 稳定签名让 TCC 授权按「Team+BundleID」记账而非 cdhash → 重编译不再反复弹「下载」目录授权。
        DEVELOPMENT_TEAM: T8F5T6HKG8
