name: UniReader
options:
  bundleIdPrefix: tech.xvanturing
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.37"
    CURRENT_PROJECT_VERSION: "27"
# 第三方包（SPM）。唯一一个：笔记编辑器的 Markdown 引擎（TextKit 2 + AppKit，只用在编辑器 sheet 里，
# 不进阅读区——阅读区纯 SwiftUI 的红线不受影响）。pre-1.0，**钉死版本**，升级要手动改这里再解析。
# 只取核心产品 `MarkdownEngine`（零外部依赖）；代码高亮/LaTeX 那两个产品各带一个第三方库，用到再加。
packages:
  MarkdownEngine:
    url: https://github.com/nodes-app/swift-markdown-engine
    exactVersion: 0.9.0
targets:
  UniReader:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: MarkdownEngine
        product: MarkdownEngine
    settings:
      base:
        PRODUCT_NAME: UniReader
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.UniReader
        GENERATE_INFOPLIST_FILE: YES
        # 部分 Info.plist（UTI/文档类型声明——.unrd 工作区包），GENERATE_INFOPLIST_FILE 会与其余 key 合并。
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: UniReader
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "UniReader 通过局域网接收平板的手写笔画与翻页操作。"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        # 固定签名身份 = zqsd 团队（含 Developer ID，后续公证直接复用）。
        # 稳定签名让 TCC 授权按「Team+BundleID」记账而非 cdhash → 重编译不再反复弹「下载」目录授权。
        DEVELOPMENT_TEAM: T8F5T6HKG8
