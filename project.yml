name: UniReader
options:
  bundleIdPrefix: tech.xvanturing
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.19"
    CURRENT_PROJECT_VERSION: "9"
targets:
  UniReader:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: UniReader
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.UniReader
        GENERATE_INFOPLIST_FILE: YES
        # 部分 Info.plist（UTI/文档类型声明——.unrd 工作区包），GENERATE_INFOPLIST_FILE 会与其余 key 合并。
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: UniReader
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "UniReader 通过局域网接收平板的手写笔画与翻页操作。"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        # 固定签名身份 = zqsd 团队（含 Developer ID，后续公证直接复用）。
        # 稳定签名让 TCC 授权按「Team+BundleID」记账而非 cdhash → 重编译不再反复弹「下载」目录授权。
        DEVELOPMENT_TEAM: T8F5T6HKG8
